name: pg

services:
  db:
    image: postgres:16
    container_name: pg-shared
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sleepsort
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sleepsort"]
      interval: 1s
      timeout: 3s
      retries: 15
    networks:
      pg-shared:
        aliases:
          - db
    restart: unless-stopped

networks:
  pg-shared:
    name: pg-shared

volumes:
  pgdata:
    name: pg-shared-data
