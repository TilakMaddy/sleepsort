name: pg

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: db
    environment:
      - TS_AUTHKEY=${CLIENT_SECRET}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale-data-pg:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: pg-shared
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sleepsort
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sleepsort"]
      interval: 1s
      timeout: 3s
      retries: 15
    depends_on:
      - tailscale
    network_mode: service:tailscale
    restart: unless-stopped

volumes:
  pgdata:
    name: pg-shared-data
  tailscale-data-pg:
    name: tailscale-data-pg
