name: sleepsort

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: app-1
    environment:
      - TS_AUTHKEY=${CLIENT_SECRET}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale-data-app:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    image: sleepsort-app:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db.taild766ac.ts.net:5432/sleepsort
    depends_on:
      tailscale:
        condition: service_healthy
    network_mode: service:tailscale

volumes:
  tailscale-data-app:
    name: tailscale-data-app
